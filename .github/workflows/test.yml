name: test

# The pixi environment only targets osx-arm64 (Apple Silicon), so this
# workflow runs exclusively on the arm64 macOS runner GitHub provides.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      # `ci` runs lint, test, check, then typecheck (in that order -- pixi's
      # depends-on chain stops at the first failure, and mypy currently has a
      # large pre-existing backlog unrelated to any one change, so it runs
      # last to keep lint/test/check's pass/fail signal visible regardless).
      # This is expected to fail on the typecheck step until that backlog is
      # paid down as its own tracked effort; treat a failure here as "check
      # which step failed," not as "nothing was verified."
      - name: Run lint, tests, notebook check, and typecheck
        run: pixi run ci
