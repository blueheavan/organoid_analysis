[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "organoid-analysis"
version = "1.0.0"
description = "Auditable 3D organoid morphology and control-scaled viability analysis"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-image>=0.26,<0.27",
  "tifffile>=2026.3.3,<2027", "pandas>=2.2,<3", "matplotlib>=3.8,<4",
  "PyYAML>=6,<7", "statsmodels>=0.14,<0.15", "pyarrow>=16,<24"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=4.1",
  "ruff>=0.1",
  "mypy>=1.7",
]

[project.scripts]
organoid-analysis = "organoid_analysis.command_line.organoid_commands:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["organoid_analysis*"]

[tool.setuptools.package-data]
"organoid_analysis.visualization.volume_viewer" = ["static/*.js", "static/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not render'"
markers = [
  "render: native offscreen VTK rendering tests; run explicitly on a graphics-capable host",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E501 (line too long): this codebase deliberately writes dense argument
# lists / dataclass field lists on single lines; enforcing 100 cols here
# would force a large, purely cosmetic reformat with no behavior value.
# N806/N803 (non-lowercase variable/argument name): `X`/`y`/`X_train` etc.
# are the standard scikit-learn feature-matrix/label-vector convention used
# throughout experimental_statistics/phenotype_exploration.py; renaming them
# away from that convention would reduce readability, not improve it.
ignore = ["E501", "N806", "N803"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pixi.workspace]
authors = ["Mac_Arm project maintainers"]
channels = ["conda-forge"]
platforms = ["osx-arm64"]
requires-pixi = ">=0.72"

[tool.pixi.activation.env]
PYTORCH_ENABLE_MPS_FALLBACK = "1"

[tool.pixi.dependencies]
python = "3.12.*"
llvm-openmp = ">=17,<20"
pyvista = ">=0.48.4,<0.49"
tifffile = ">=2026.3.3,<2027"
ome-types = ">=0.6.3,<0.7"

[tool.pixi.pypi-dependencies]
cellpose = "==4.2.1.1"
imagecodecs = ">=2024.1.1"
ipykernel = ">=6.29,<7"
nbformat = ">=5.10,<6"
nbconvert = ">=7.16,<8"
openpyxl = ">=3.1,<4"
plotly = ">=5.18,<6"
seaborn = ">=0.13,<0.14"
statsmodels = ">=0.14,<0.15"
streamlit = ">=1.40,<2"
torch = "==2.7.1"
torchvision = "==0.22.1"
xgboost = ">=2.1,<3"
dinov3 = { git = "https://github.com/facebookresearch/dinov3", rev = "6876159a11b4df116f30f667f8c9888617df0751" }
stpyvista = { version = ">=0.2.1, <0.3", extras = ["trame"] }
pytest = ">=9.1.1, <10"
pytest-cov = ">=4.1"
ruff = ">=0.1"
mypy = ">=1.7"
pyarrow = ">=16,<24"
pillow = ">=11,<13"
organoid-analysis = { path = ".", editable = true }

[tool.pixi.tasks]
check = "python scripts/validate_notebooks.py"
kernel = "python -m ipykernel install --sys-prefix --name 3d-organoid-mac-arm --display-name 'Python (3D Organoid Mac Arm)'"
smoke = "python scripts/smoke_segmentation.py"
test = "python -m pytest -v"
test-render = "python -m pytest -v -m render"
lint = "ruff check src tests scripts"
format = "ruff format src tests scripts"
typecheck = "mypy src/organoid_analysis"
# typecheck runs last: pixi's depends-on chain stops at the first failure,
# and mypy currently has a large pre-existing backlog (unrelated to any one
# change) that would otherwise hide whether lint/test/check ever ran.
ci = { depends-on = ["lint", "test", "check", "typecheck"] }
preview = "python scripts/run_app.py src/organoid_analysis/web_interface/preview_2d.py"
app = "python scripts/run_app.py src/organoid_analysis/web_interface/organoid_workspace.py"
# --- data management ---
data = "bash scripts/download_data.sh"
# --- analysis pipeline ---
analysis-test = "python -m pytest tests -v"
analysis-demo = "python -m organoid_analysis demo --out data/synthetic_demo"
analysis-analyze = "python -m organoid_analysis analyze"
analysis-cells = "python -m organoid_analysis cells"
