[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "organoid3d-pipeline"
version = "1.0.0"
description = "Auditable 3D organoid morphology and control-scaled viability analysis"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-image>=0.26,<0.27",
  "tifffile>=2026.3.3,<2027", "pandas>=2.2,<3", "matplotlib>=3.8,<4",
  "PyYAML>=6,<7", "statsmodels>=0.14,<0.15", "pyarrow>=16,<24"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
analysis = "analysis.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["analysis*", "analysis.*", "segmentation*", "segmentation.*", "ui*", "ui.*"]

[tool.pytest.ini_options]
testpaths = ["src/analysis/tests"]
addopts = "-q"

[tool.pixi.workspace]
authors = ["Mac_Arm project maintainers"]
channels = ["conda-forge"]
platforms = ["osx-arm64"]
requires-pixi = ">=0.72"

[tool.pixi.activation.env]
PYTORCH_ENABLE_MPS_FALLBACK = "1"

[tool.pixi.dependencies]
python = "3.12.*"
llvm-openmp = ">=17,<20"
pyvista = ">=0.48.4,<0.49"
tifffile = ">=2026.3.3,<2027"
ome-types = ">=0.6.3,<0.7"

[tool.pixi.pypi-dependencies]
cellpose = "==4.2.1.1"
imagecodecs = ">=2024.1.1"
ipykernel = ">=6.29,<7"
nbformat = ">=5.10,<6"
nbconvert = ">=7.16,<8"
openpyxl = ">=3.1,<4"
plotly = ">=5.18,<6"
seaborn = ">=0.13,<0.14"
statsmodels = ">=0.14,<0.15"
streamlit = ">=1.40,<2"
torch = "==2.7.1"
torchvision = "==0.22.1"
xgboost = ">=2.1,<3"
dinov3 = { git = "https://github.com/facebookresearch/dinov3", rev = "6876159a11b4df116f30f667f8c9888617df0751" }
stpyvista = { version = ">=0.2.1, <0.3", extras = ["trame"] }
pytest = ">=9.1.1, <10"
pyarrow = ">=16,<24"
pillow = ">=11,<13"
organoid3d-pipeline = { path = ".", editable = true }

[tool.pixi.tasks]
check = "python scripts/validate_notebooks.py"
kernel = "python -m ipykernel install --sys-prefix --name 3d-organoid-mac-arm --display-name 'Python (3D Organoid Mac Arm)'"
smoke = "PYTHONPATH=src python -m scripts.smoke_segmentation"
test = "PYTHONPATH=src python -m unittest discover -s tests -v"
preview = "PYTHONPATH=src python -m scripts.run_app src/ui/preview_2d.py"
app = "PYTHONPATH=src python -m scripts.run_app src/ui/app.py"
# --- data management ---
data = "bash scripts/download_data.sh"
# --- analysis pipeline ---
analysis-test = "python -m pytest src/analysis/tests -v"
analysis-demo = "python -m analysis demo --out data/synthetic_demo"
analysis-analyze = "python -m analysis analyze"
analysis-cells = "python -m analysis cells"
